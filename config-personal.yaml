# Personal vault. Fleet-wide defaults live in config-base.yaml —
# keys here override the base (deep merge, this file wins).
vault:
  path: /mnt/external/vault-personal
  ignore_dirs:                # replaces the base list wholesale (extra entry at end)
    - inbox
    - wiki
    - _archived
    - _templates
    - _bases
    - .obsidian
    - content/published       # finished posts — no need to re-index

data_dir: ./data-personal
