# Employment vault. Fleet-wide defaults live in config-base.yaml —
# keys here override the base (deep merge, this file wins).
vault:
  path: /mnt/external/vault-employment

data_dir: ./data-employment

# Betson carve-out: this vault's text never leaves benderman, whatever
# config-base.yaml's llm.api says. The meta MCP server loads this file too.
# model is blank on purpose: blank means this vault's ollama.llm_model, and
# it overrides any llm.model set in config-base.yaml (a Spark model name the
# local Ollama doesn't have).
llm:
  api: ollama
  base_url: http://127.0.0.1:11434
  model: ""
