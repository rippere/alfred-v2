[build-system]
requires = ["setuptools>=69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-v2"
version = "0.1.0"
description = "Personal agentic knowledge infrastructure. Self-hosted. Always on."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "anyio>=4.13.0",
    "fastmcp==3.2.4",
    "flashrank==0.2.10",
    "httpx>=0.27",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "networkx>=3.6.1",
    "openai>=1.30",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rich>=13.0",
    "structlog>=24.0",
    "typer>=0.25.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
embed = [
    "igraph>=0.11",
    "leidenalg>=0.10",
    "numpy>=1.26",
    "pymilvus[milvus-lite]>=2.4",
    "scikit-learn>=1.4",
    "scipy>=1.10",
]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
]

[project.scripts]
alfred = "alfred.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
