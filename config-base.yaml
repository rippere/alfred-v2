# config-base.yaml — shared defaults for every vault config in this directory.
#
# AlfredConfig.load() deep-merges, lowest precedence first:
#   dataclass defaults  <-  this file  <-  the vault's own config-*.yaml
# The vault file always wins. Dicts merge recursively; scalars and lists
# (e.g. vault.ignore_dirs) are replaced wholesale by the vault file.
#
# Put a key here when it is genuinely fleet-wide. Put it in the vault file
# when it is an intentional per-vault deviation (see config-content.yaml).
# This file is NOT itself a loadable vault config — it has no vault.path.

vault:
  ignore_dirs:
    - inbox
    - wiki
    - _archived
    - _templates
    - _bases
    - .obsidian

ollama:
  base_url: http://localhost:11434
  embed_model: nomic-embed-text
  llm_model: mistral:latest

janitor:
  sweep_interval_s: 14400
  deep_interval_h: 24
  max_bytes_per_call: 8000
  dedup_enabled: false    # disabled until dry-run gate is tested

distiller:
  mode: scheduled         # scheduled = nightly at 2am | on_demand = explicit trigger only

api_budget:
  max_calls_per_day: 500
  warn_at_calls: 400

query:
  top_k: 8
  hopfield_beta: 2.0

synthesis:
  anthropic_model: claude-sonnet-4-6
  openrouter_model: x-ai/grok-4.1-fast
