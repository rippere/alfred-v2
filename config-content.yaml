vault:
  path: /mnt/external/vault-content
  ignore_dirs:
    - published
    - _archived
    - _templates
    - .obsidian

data_dir: ./data-content

ollama:
  base_url: http://localhost:11434
  embed_model: nomic-embed-text
  llm_model: mistral:latest

janitor:
  sweep_interval_s: 7200     # every 2h — content files are shorter, quicker pass
  deep_interval_h: 48
  max_bytes_per_call: 8000
  dedup_enabled: false

distiller:
  mode: scheduled             # nightly at 2am — extracts reusable hooks/angles from what worked

api_budget:
  max_calls_per_day: 100      # tighter budget — content vault is smaller
  warn_at_calls: 80

query:
  top_k: 6
  hopfield_beta: 2.0

synthesis:
  anthropic_model: claude-sonnet-4-6
  openrouter_model: x-ai/grok-4.1-fast
